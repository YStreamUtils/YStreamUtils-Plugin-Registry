name: Plugin Registry Validation

on:
  pull_request:
    branches: [master]
    paths:
      - "plugins/**"
  workflow_dispatch:

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Context
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Changed Plugin Directories
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          dir_names: true
          dir_names_max_depth: 3
          files: "plugins/**"

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: ci/go.sum

      - name: Pull Go Modules
        run: |
          cd ci
          go mod download

      - name: Verify Changed Plugin Manifests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Exposes something like "plugins/owner1/plugin1 plugins/owner2/plugin2"
          CHANGED_PLUGINS: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          go run ci/verify.go
