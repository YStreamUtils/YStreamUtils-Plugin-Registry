name: Plugin Registry Validation Guard

on:
  pull_request:
    branches: [master]
    paths:
      - "plugins/**"
  workflow_dispatch:

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Context
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Pull Go Modules
        run: |
          cd ci
          go mod tidy
          go mod download

      - name: Execute Recursive Multi-Manifest Verification
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p plugins
          go run ci/verify.go
