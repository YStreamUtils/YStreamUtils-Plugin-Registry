name: Compile Registry Distribution

on:
  push:
    branches: [master]
    paths:
      - "plugins/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: 'github-pages'
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Context
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: ci/go.sum

      - name: Pull Go Modules
        run: |
          cd ci
          go mod download

      - name: Generate Unified Registry Asset
        working-directory: ci/generate
        run: |
          mkdir -p ../../public
          go run generate_registry.go

      - name: Setup Pages Infrastructure
        uses: actions/configure-pages@v5

      - name: Upload Pages Distribution Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./public"

      - name: Deploy to GitHub Pages Website
        id: deployment
        uses: actions/deploy-pages@v4
