name: Compile Registry Distribution

on:
  push:
    branches: [master]
    paths:
      - "plugins/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: 'github-pages'
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Context
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Generate Unified Registry Asset
        run: |
          dotnet run --project ci/ci.csproj -- --publish

      - name: Setup Pages Infrastructure
        uses: actions/configure-pages@v5

      - name: Upload Pages Distribution Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./public"

      - name: Deploy to GitHub Pages Website
        id: deployment
        uses: actions/deploy-pages@v4
