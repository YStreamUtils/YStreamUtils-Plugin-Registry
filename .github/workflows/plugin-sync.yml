name: Scheduled Plugin Sync

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-upstream-plugins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Registry Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Execute Sync Engine
        id: sync_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet run --project ci/ci.csproj -- --sync

      - name: Create Tracking Pull Request
        if: steps.sync_run.outputs.has_updates == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(plugins): auto-sync upstream manifest modifications"
          branch: "automated/plugin-manifest-sync"
          title: "chore(sync): update plugin registry manifests"
          body: "Automated .NET background sync completed successfully. Forwarding changes downstream..."

      - name: Process Pull Request Approval Status
        if: steps.sync_run.outputs.has_updates == 'true' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.cpr.outputs.pull-request-number }}"
          echo "Safe update detected. Auto-approving PR #$PR_NUMBER..."
          gh pr review "$PR_NUMBER" --approve
