name: Scheduled Plugin Sync

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  scan-and-build-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Registry Code
        uses: actions/checkout@v4

      - name: Scan for Manifest Updates
        id: scanner
        run: |
          echo "HAS_UPDATES=false" >> $GITHUB_ENV
          
          while read -r manifest_path; do
            OWNER=$(yq '.source.owner' "$manifest_path")
            REPO=$(yq '.source.repository' "$manifest_path")
            PLUGIN_NAME=$(yq '.name' "$manifest_path")
            
            RELEASE_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://github.com")
            LATEST_TAG=$(echo "$RELEASE_JSON" | yq '.tag_name')
            
            if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then continue; fi
            
            EXPECTED_ZIP="${PLUGIN_NAME}.zip"
            DOWNLOAD_URL=$(echo "$RELEASE_JSON" | yq ".assets[] | select(.name == \"$EXPECTED_ZIP\") | .browser_download_url")
            
            if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then continue; fi
            
            mkdir -p "temp_sync/$OWNER/$REPO"
            curl -sL "$DOWNLOAD_URL" -o "temp_sync/$OWNER/$REPO/$EXPECTED_ZIP"
            
            unzip -p "temp_sync/$OWNER/$REPO/$EXPECTED_ZIP" "manifest.toml" > "temp_sync/$OWNER/$REPO/manifest.toml"
            
            if ! cmp -s "$manifest_path" "temp_sync/$OWNER/$REPO/manifest.toml"; then
              cp "temp_sync/$OWNER/$REPO/manifest.toml" "$manifest_path"
              echo "HAS_UPDATES=true" >> $GITHUB_ENV
            fi
          done < <(find plugins -name "manifest.toml")
          
          rm -rf temp_sync

      - name: Setup Go Environment
        if: env.HAS_UPDATES == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: ci/go.sum

      - name: Run Go Registry Integrity Linter
        if: env.HAS_UPDATES == 'true'
        working-directory: ci
        run: |
          export CHANGED_PLUGINS="plugins/"
          go mod download
          go run verify/verify.go

      - name: Create Tracking Pull Request
        if: env.HAS_UPDATES == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(plugins): auto-sync upstream manifest modifications"
          branch: "automated/plugin-manifest-sync"
          title: "chore(sync): update plugin registry manifests"
          body: "Automated scan completed. Testing package integrity..."

      - name: Evaluate and Handle Automerge Phase
        if: env.HAS_UPDATES == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.cpr.outputs.pull-request-number }}"

          if [ -f .require_manual_review ]; then
            gh pr edit "$PR_NUMBER" --add-label "manual-review-required"
          else
            gh pr merge "$PR_NUMBER" --squash --auto
          fi
