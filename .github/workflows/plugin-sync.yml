name: Scheduled Plugin Sync

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scan-and-build-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Registry Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: ci/go.sum

      - name: Scan for Manifest Updates
        working-directory: ci
        run: |
          rm -f ../.has_updates_token
          go mod download
          go run sync/sync.go
          
          if [ -f ../.has_updates_token ]; then
            echo "HAS_UPDATES=true" >> $GITHUB_ENV
            rm -f ../.has_updates_token
          else
            echo "HAS_UPDATES=false" >> $GITHUB_ENV
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Go Registry Integrity Linter
        if: env.HAS_UPDATES == 'true'
        working-directory: ci
        run: |
          export CHANGED_PLUGINS="plugins/"
          export GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          go run verify/verify.go

      - name: Create Tracking Pull Request
        if: env.HAS_UPDATES == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(plugins): auto-sync upstream manifest modifications"
          branch: "automated/plugin-manifest-sync"
          title: "chore(sync): update plugin registry manifests"
          body: "Automated scan completed. Testing package integrity..."

      - name: Auto-approve Pull Request
        if: env.HAS_UPDATES == 'true' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.cpr.outputs.pull-request-number }}"
          
          if [ ! -f ci/.require_manual_review ]; then
            gh pr review "$PR_NUMBER" --approve
          else
            gh pr edit "$PR_NUMBER" --add-label "manual-review-required"
          fi
