name: Scheduled Plugin Sync

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-upstream-plugins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Registry Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Execute Sync Engine
        id: sync_run
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet run --project ci/ci.csproj -- --sync
          
          # Intercept C# application exit codes natively
          STATUS=$?
          if [ $STATUS -eq 0 ]; then
            echo "UPDATES_FOUND=false" >> $GITHUB_ENV
          elif [ $STATUS -eq 10 ]; then
            echo "UPDATES_FOUND=true" >> $GITHUB_ENV
            echo "REQUIRES_REVIEW=false" >> $GITHUB_ENV
          elif [ $STATUS -eq 11 ]; then
            echo "UPDATES_FOUND=true" >> $GITHUB_ENV
            echo "REQUIRES_REVIEW=true" >> $GITHUB_ENV
          else
            echo "Error: Sync engine encountered an unhandled crash or exception."
            exit $STATUS
          fi

      - name: Create Tracking Pull Request
        if: env.UPDATES_FOUND == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(plugins): auto-sync upstream manifest modifications"
          branch: "automated/plugin-manifest-sync"
          title: "chore(sync): update plugin registry manifests"
          body: "Automated .NET background sync completed successfully. Forwarding changes downstream..."

      - name: Process Pull Request Approval Status
        if: env.UPDATES_FOUND == 'true' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.cpr.outputs.pull-request-number }}"
          
          if [ "${{ env.REQUIRES_REVIEW }}" = "false" ]; then
            echo "Safe update detected. Auto-approving PR #$PR_NUMBER..."
            gh pr review "$PR_NUMBER" --approve
          else
            echo "Major version modification detected. Labeling PR #$PR_NUMBER for manual review..."
            gh pr edit "$PR_NUMBER" --add-label "manual-review-required"
          fi
